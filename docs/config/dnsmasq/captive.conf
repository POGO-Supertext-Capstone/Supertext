# captive hotspot DNS and DHCP configuration
# NetworkManager assigns 10.42.0.1/24 to wlan0

interface=wlan0
bind-dynamic
listen-address=10.42.0.1

dhcp-range=10.42.0.50,10.42.0.150,255.255.255.0,12h

dhcp-option=3,10.42.0.1
dhcp-option=6,10.42.0.1

# resolve requested hostnames to the local captive portal address
address=/#/10.42.0.1
