name: Lint & Format

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Install Dependencies
        run: go mod tidy
      - name: Format
        run: go fmt ./...
      - name: Vet
        run: go vet ./...
