<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/web/js/htmx.min.js"></script>
    <title>Upload PPTX</title>
    <style>
      .spinner {
        display: none;
      }
      
      .htmx-request .spinner {
        display: inline;
      }
      
      .htmx-request.spinner {
        display: inline;
      }
      
      .htmx-request.spinner ~ .button-text {
        display: none;
      }
    </style>
</head>
<body>

<form
  hx-post="/v1/upload"
  hx-encoding="multipart/form-data"
  hx-swap="outerHTML"
  id="form"
  hx-indicator="#spinner"
>
  <div>
    <label for="name">Presentation Name</label>
    <input hx-preserve type="text" id="name" name="name" required>
  </div>

  <div>
    <label for="file">File (PPTX):</label>
    <input hx-preserve type="file" id="file" name="file"
           accept=".pptx" required>
  </div>

  <svg class="spinner animate-spin" id="spinner" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>

  <button type="submit">Upload</button>
</form>

</body>
</html>
