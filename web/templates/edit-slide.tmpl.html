<tr hx-trigger='cancel' class='editing' hx-get="/v1/slide/{{.Name}}/{{.ID}}/edit">
  <td><div contenteditable="true" data-field="text">{{.Text}}</div></td>
  <td>
    <button class="btn danger" hx-get="/v1/slide/{{.Name}}/{{.ID}}">Cancel</button>
    <button class="btn danger"
            hx-put="/v1/slide/{{.Name}}/{{.ID}}"
            hx-include="closest tr"
            hx-vals='js:text: this.closest("tr").querySelector("[data-field=text]").innerHTML'>
      Save
    </button>
  </td>
</tr>
